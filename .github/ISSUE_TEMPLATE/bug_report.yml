name: Bug report
description: Report a reproducible problem in the skill, installer, or state workflow.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Agent or client
      options: [Codex, Claude Code, Claude, Cursor, OpenCode, Other]
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Triggering request
      description: Remove private learning material before posting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant state excerpt
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data and copyrighted source text.
          required: true
